# Named Cloudflare Tunnel for dialtact.com (stable URLs, not trycloudflare.com)
#
# ONE-TIME SETUP:
#   1. Move DNS for dialtact.com to Cloudflare (or add site in Cloudflare dashboard)
#   2. cloudflared tunnel login
#   3. cloudflared tunnel create voice-agent-dev
#   4. Copy tunnel UUID into tunnel: line below
#   5. cloudflared tunnel route dns voice-agent-dev api-dev.dialtact.com
#   6. cloudflared tunnel route dns voice-agent-dev app-dev.dialtact.com
#
# Then run: cloudflared tunnel --config cloudflared/config.yml run voice-agent-dev

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: C:\Users\subha\.cloudflared\REPLACE_WITH_TUNNEL_UUID.json

ingress:
  # Carrier webhooks (Vobiz / Telnyx) must reach the API directly.
  - hostname: api-dev.dialtact.com
    service: http://127.0.0.1:8000
  - hostname: api.dialtact.com
    service: http://127.0.0.1:8000
  # Public product UI. Dialtact proxies /api and /ws to 8000.
  - hostname: app-dev.dialtact.com
    service: http://127.0.0.1:5173
  - hostname: app.dialtact.com
    service: http://127.0.0.1:5173
  - hostname: dialtact.com
    service: http://127.0.0.1:5173
  - service: http_status:404
