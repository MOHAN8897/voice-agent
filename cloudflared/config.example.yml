# Named Cloudflare Tunnel for hustlelabs.in (stable URLs, not trycloudflare.com)
#
# ONE-TIME SETUP (you do this once in browser):
#   1. Move DNS for hustlelabs.in to Cloudflare (or add site in Cloudflare dashboard)
#   2. cloudflared tunnel login
#   3. cloudflared tunnel create voice-agent-dev
#   4. Copy tunnel UUID into tunnel: line below
#   5. cloudflared tunnel route dns voice-agent-dev api-dev.hustlelabs.in
#   6. cloudflared tunnel route dns voice-agent-dev app-dev.hustlelabs.in
#
# Then run: cloudflared tunnel --config cloudflared/config.yml run voice-agent-dev

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: C:\Users\subha\.cloudflared\REPLACE_WITH_TUNNEL_UUID.json

ingress:
  # Carrier webhooks (Telnyx / Exotel) must reach the API directly.
  - hostname: api-dev.hustlelabs.in
    service: http://127.0.0.1:8000
  # Public product UI only. Voxly proxies /api and /ws to 8000.
  # /dev and /api/dev are blocked on non-localhost Host (see vite + API middleware);
  # open the ops console at http://localhost:3000/dev on the machine running the stack.
  - hostname: app-dev.hustlelabs.in
    service: http://127.0.0.1:5173
  - service: http_status:404
