services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice_agent
      POSTGRES_PASSWORD: voice_agent
      POSTGRES_DB: voice_agent
    ports:
      - "5432:5432"
    volumes:
      - voice_agent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_agent -d voice_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  voice_agent_pg:
