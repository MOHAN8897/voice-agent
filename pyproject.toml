[project]
name = "telugu-agent"
version = "0.1.0"
description = "Telugu-first Voice AI Agent — Phase 1 & 2 (FastAPI + Sarvam + OpenAI Responses API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.60",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.9",
    "redis>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
exclude = ["client", "client.*"]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
