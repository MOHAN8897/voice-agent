[project]
name = "telugu-agent"
version = "0.1.0"
description = "Telugu-first Voice AI Agent — Phase 1 & 2 (FastAPI + Sarvam + OpenAI Responses API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.34",
    "python-dotenv>=1.2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.60",
    "google-genai>=1.30",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "urllib3>=2.8.0",
  "jsonschema[format-nongpl]>=4.23,<5",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "cryptography>=42",
    "PyJWT>=2.9",
    "razorpay>=1.4",
    "reportlab>=4.2",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    # Decodes carrier MP3 recordings and encodes downloads (server/call/audio_mp3.py).
    # Without it recordings fall back to the raw, unbalanced carrier file.
    "av>=12",
    # IANA tz database for zoneinfo. Windows has no system tzdata, and the
    # inbound business-hours policy must not fall back to naive UTC there.
    "tzdata>=2024.1",
    "redis>=5.0",
    "aioboto3>=12.0",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
markers = [
    "live_realtime: live OpenAI Realtime websocket probes (LIVE_TEST=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
exclude = ["client", "client.*"]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
