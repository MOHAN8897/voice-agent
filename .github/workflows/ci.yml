name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest server/tests -q --tb=short
        env:
          OPENAI_API_KEY: sk-test-ci
          SARVAM_API_KEY: sarvam-test-ci

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Apply every migration
        run: python -m alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/voice_test
          OPENAI_API_KEY: sk-test-ci
          SARVAM_API_KEY: sarvam-test-ci
      - name: Assert database revision equals the shipped head
        run: python -m scripts.verify_postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/voice_test
          OPENAI_API_KEY: sk-test-ci
          SARVAM_API_KEY: sarvam-test-ci

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: .
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          OPENAI_API_KEY: sk-test-ci
          SARVAM_API_KEY: sarvam-test-ci
